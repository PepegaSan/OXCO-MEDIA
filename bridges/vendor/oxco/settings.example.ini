[SETTINGS]
language = en
buffer_seconds = 2.0
pixel_noise_threshold = 15
changed_pixels_threshold = 200
# If more pixels than this differ, the frame is ignored as "difference" (0 = off). Example: global rescale/KI.
changed_pixels_max_threshold = 0
# classic = changed pixel count at full resolution (thresholds above, legacy behaviour)
# blob    = area of the largest changed region at analysis_width (ignores scattered codec noise; ~5x faster).
#           Uses its own scale — typical: pixel_noise_threshold 12, changed_pixels_threshold 100.
analysis_mode = classic
analysis_width = 640
analysis_blur = 3
# Decode with -hwaccel auto in blob mode (falls back to CPU automatically).
analysis_hwaccel = 0
# Detect dropped/duplicated leading frames (± max frames) and pair frames accordingly.
auto_sync_offset = 1
max_sync_offset_frames = 12
# Difference runs shorter than this are noise spikes (1 = off).
min_diff_run_frames = 2
# Kept leftovers shorter than this between cuts are cut too (0 = off).
min_keep_seconds = 0.25
# Extend every cut by this many frames on both sides.
cut_padding_frames = 0
# Reuse cached per-frame measurements when only buffer/pixel/post filters changed.
reuse_metrics = 1
enable_ffmpeg_export = 0
ffmpeg_export_target = both
# cpu | cpu_hevc | nvidia_h264 | nvidia_hevc | nvidia_av1 | amd_h264 | amd_hevc | intel_h264 | intel_hevc
# (FFmpeg names like libx264 / h264_nvenc are accepted too; unknown values fall back to cpu)
ffmpeg_encoder = libx264
# 1 = FFmpeg and DaVinci never reuse the same output basename: append _b…_n…_p… from filter; if file exists, _2…_20.
export_avoid_overwrite = 0
enable_fullcheck_edl = 0
enable_autodelete_edl = 1
enable_davinci_export = 0
davinci_render_timeout_seconds = 1800
davinci_render_preset = AutoCutPreset
davinci_startup_wait_seconds = 20
# How long compare waits for scriptapp("Resolve") after analysis (Studio only; slow PCs may need more).
davinci_scriptapp_retry_attempts = 60
davinci_scriptapp_retry_delay_seconds = 3

[PATHS]
# DaVinci Resolve Studio — „Modules“-Ordner (leer = Oxco nutzt OS-Standard beim ersten Start).
# Typical Windows: C:/ProgramData/Blackmagic Design/DaVinci Resolve/Support/Developer/Scripting/Modules
# Typical macOS: /Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting/Modules
davinci_api_path =
# Optional: Resolve binary — compare can auto-start Resolve (Windows). Typical:
# C:/Program Files/Blackmagic Design/DaVinci Resolve/Resolve.exe
davinci_exe_path =
final_export_dir =

[GUI]
last_manual_source =
last_manual_df =
ui_theme = dark
